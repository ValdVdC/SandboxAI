# CodeRabbit Configuration
language: "pt-BR"

reviews:
  profile: "chill"
  collapse_draft_pr_reviews: true
  
  # Custom guidelines mapped to specific paths
  path_instructions:
    - path: "backend/app/**"
      instructions: "Certifique-se de que toda a lógica siga o padrão Python 3.11+, PEP 8 e Ruff. Verifique rigorosamente o uso de tipagem estrita; não é permitido o uso de tipos implícitos como `Any` ou `any`. Garanta que todos os novos schemas Pydantic ou modelos SQLModel estejam declarados de forma explícita e modular."
    
    - path: "frontend/src/**"
      instructions: "Garanta a conformidade estrita com o React 18+ e TypeScript (strict mode). Tipagens como `any` não são permitidas em nenhuma circunstância. Verifique se o estilo adota as variáveis de CSS globais da aplicação para garantir consistência estética e responsividade móvel."
    
    - path: "**"
      instructions: "Valide a segurança e integridade operacional. Nunca permita a inclusão de segredos, tokens ou arquivos `.env` no histórico de commits. Assegure que qualquer nova dependência adicionada esteja devidamente registrada em `backend/requirements.txt` (com versão fixada) ou `frontend/package.json` (via npm)."
