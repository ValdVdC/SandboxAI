# CodeRabbit Configuration
language: "pt-BR"

reviews:
  profile: "assertive"
  collapse_draft_pr_reviews: true
  
  # Habilita revisões automáticas para PRs com alvo em develop e main
  base_branches:
    - "main"
    - "develop"
  
  # Custom guidelines mapped to specific paths
  path_instructions:
    - path: "backend/app/**"
      instructions: |
        Certifique-se de que toda a lógica siga o padrão Python 3.11+, PEP 8 e Ruff.
        Verifique rigorosamente o uso de tipagem estrita; não é permitido `Any` implícito.
        Garanta que todos os novos schemas Pydantic ou modelos SQLModel estejam declarados de forma explícita e modular.
        Toda operação de banco de dados deve estar envolvida em try/except com rollback explícito.
        Novos providers de LLM devem seguir o Factory Pattern estabelecido em app/workers/tasks.py.
        Todos os novos endpoints devem ter docstrings claras.

    - path: "frontend/src/**"
      instructions: |
        Garanta conformidade estrita com React 18+ e TypeScript strict mode. Sem `any`.
        Verifique se o estilo adota as variáveis CSS globais para consistência e responsividade.
        Todas as respostas de API devem ser tipadas via interfaces em src/types/index.ts.
        Busca de dados deve usar o hook useApiData — não fetch/axios direto.
        Novos componentes devem ser acessíveis (atributos ARIA onde necessário).

    - path: "**"
      instructions: |
        Nunca permitir segredos, tokens ou arquivos .env no histórico de commits.
        Novas dependências devem estar em requirements.txt (versão fixada) ou package.json.
        Cobertura mínima de 70% para qualquer nova funcionalidade.
        Mensagens de commit devem seguir Conventional Commits.
